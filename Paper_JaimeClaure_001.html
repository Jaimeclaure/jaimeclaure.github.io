<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper // Evaluación Científica — Jaime Claure</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Capa flotante para mitigar clics en los botones de descarga nativa */
    .capa-shield {
      position: absolute;
      top: 0;
      right: 0;
      width: 180px;
      height: 48px;
      background: transparent;
      z-index: 9999;
      pointer-events: all;
    }
  </style>
  <script>
    // Mitigación de menú contextual y atajos comunes de guardado
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u'].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
      if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase()))) {
        e.preventDefault();
      }
    });
  </script>
</head>

<body>
  <div class="capa-shield"></div>
  <!-- Abre PDF.js forzando el menú lateral de capítulos / marcadores abierto -->
  <iframe src="pdfjs/web/viewer.html?file=../../documentos/mod10_defensa.pdf#pagemode=bookmarks"></iframe>
</body>

</html>
