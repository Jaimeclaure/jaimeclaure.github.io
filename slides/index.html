<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030712">
  <title>Presentaciones // Jaime Claure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg-dark: #030712;
      --color-olive: #929b6a;
      --color-ochre: #c3924e;
      --bg-card: #0b0f19;
      --bg-card-hover: #111827;
      --text-main: #f3f4f6;
      --text-body: #d1d5db;
      --text-muted: #6b7280;
      --border-subtle: #1f2937;
      --border-hover: #374151;
      --font-mono: "JetBrains Mono", monospace;
      --font-sans: Inter, "Segoe UI", Arial, sans-serif;
      font-family: var(--font-sans);
      background: var(--bg-dark);
      color: var(--text-body);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 14% 10%, rgba(111, 124, 77, 0.11), transparent 34rem),
        linear-gradient(145deg, #080d18 0%, var(--bg-dark) 64%, #080d18 100%);
      position: relative;
      overflow-x: hidden;
    }

    button,
    a {
      font: inherit;
    }

    .blueprint-grid {
      position: fixed;
      inset: 24px;
      border: 1px dashed rgba(31, 41, 55, 0.55);
      pointer-events: none;
      z-index: 0;
    }

    .catalog-view {
      position: relative;
      z-index: 1;
      width: min(100% - 64px, 1024px);
      min-height: calc(100vh - 48px);
      margin: 0 auto;
      padding: clamp(32px, 7vh, 64px) 0 36px;
      display: flex;
      flex-direction: column;
    }

    .catalog-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 22px;
      padding-bottom: 26px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-lockup {
      min-width: 0;
    }

    .home-link,
    .back-button,
    .open-link {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid var(--border-hover);
      border-radius: 4px;
      background: rgba(11, 15, 25, 0.8);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.045em;
      text-decoration: none;
      white-space: nowrap;
      transition: border-color 180ms ease, background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .home-link:hover,
    .back-button:hover,
    .open-link:hover {
      transform: translateY(-1px);
      border-color: var(--color-olive);
      background: rgba(111, 124, 77, 0.16);
      color: #fff;
    }

    .compact-label {
      display: none;
    }

    .status-mark {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--color-olive);
      box-shadow: 0 0 9px rgba(146, 155, 106, 0.72);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
      color: var(--color-olive);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 740px;
      margin: 0;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: clamp(1.75rem, 4vw, 2.7rem);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 1.15;
    }

    .intro {
      max-width: 650px;
      margin: 15px 0 0;
      color: #aeb9c7;
      font-size: 0.92rem;
      line-height: 1.75;
    }

    .presentation-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 14px;
      margin-top: 34px;
    }

    .presentation-card {
      display: flex;
      min-height: 218px;
      flex-direction: column;
      align-items: flex-start;
      padding: 22px;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      background: linear-gradient(145deg, rgba(11, 15, 25, 0.98), rgba(8, 13, 24, 0.98));
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color 180ms ease, transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .presentation-card:hover,
    .presentation-card:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(146, 155, 106, 0.72);
      background: linear-gradient(145deg, var(--bg-card-hover), #0b1220);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.24);
      outline: none;
    }

    .presentation-card:nth-child(even):hover,
    .presentation-card:nth-child(even):focus-visible {
      border-color: rgba(195, 146, 78, 0.72);
    }

    .card-topline,
    .card-footer {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
    }

    .card-id {
      color: var(--color-olive);
      font-family: var(--font-mono);
      font-size: 0.71rem;
      font-weight: 600;
      letter-spacing: 0.1em;
    }

    .presentation-card h2 {
      margin: 25px 0 9px;
      color: var(--text-main);
      font-size: 1.08rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.45;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 22px;
      color: var(--color-olive);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .presentation-card:nth-child(even) .card-id,
    .presentation-card:nth-child(even) .card-footer {
      color: var(--color-ochre);
    }

    .catalog-error {
      margin-top: 32px;
      padding: 16px 18px;
      border: 1px solid rgba(195, 146, 78, 0.45);
      border-radius: 4px;
      background: rgba(124, 45, 18, 0.2);
      color: #fed7aa;
      line-height: 1.6;
    }

    .viewer-view[hidden],
    .catalog-view[hidden] {
      display: none;
    }

    .viewer-view {
      position: relative;
      z-index: 1;
      display: flex;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      background: #030712;
    }

    .viewer-toolbar {
      z-index: 1;
      display: flex;
      min-height: 56px;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border-subtle);
      background: #080d18;
    }

    .back-button {
      cursor: pointer;
    }

    .open-link {
      margin-left: auto;
    }

    .viewer-title {
      overflow: hidden;
      color: #aeb9c7;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #deck-frame {
      width: 100%;
      min-height: 0;
      flex: 1;
      border: 0;
      background: #030712;
    }

    @media (min-width: 768px) {
      .blueprint-grid {
        inset: 48px;
      }
    }

    @media (max-width: 560px) {
      .catalog-view {
        width: min(100% - 36px, 1024px);
        min-height: calc(100vh - 36px);
        padding-top: 28px;
      }

      .catalog-header {
        align-items: flex-start;
        gap: 12px;
      }

      .home-link {
        min-height: 34px;
        padding: 0 9px;
        font-size: 0.62rem;
      }

      .full-label {
        display: none;
      }

      .compact-label {
        display: inline;
      }

      .presentation-list {
        margin-top: 26px;
      }

      .viewer-toolbar {
        gap: 7px;
        padding: 0 8px;
      }

      .viewer-title {
        font-size: 0.62rem;
      }

      .back-button,
      .open-link {
        min-height: 34px;
        padding: 0 8px;
        font-size: 0.6rem;
      }
    }

    @media (max-width: 390px) {
      .viewer-title {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="blueprint-grid" aria-hidden="true"></div>
  <main id="catalog-view" class="catalog-view">
    <header class="catalog-header">
      <div class="brand-lockup">
        <p class="eyebrow"><span class="status-mark" aria-hidden="true"></span> Jaime Claure · Assets server</p>
        <h1>Índice de presentaciones</h1>
      </div>
      <a class="home-link" href="../index.html"><span class="full-label">← INTERFAZ PRINCIPAL</span><span class="compact-label">← INICIO</span></a>
    </header>
    <p class="intro">Presentaciones ejecutivas y académicas disponibles para su visualización. Selecciona un título para iniciar.</p>
    <section id="presentation-list" class="presentation-list" aria-label="Catálogo de presentaciones"></section>
    <p id="catalog-error" class="catalog-error" role="alert" hidden></p>
  </main>

  <main id="viewer-view" class="viewer-view" hidden>
    <header class="viewer-toolbar">
      <button id="back-button" class="back-button" type="button">← Catálogo</button>
      <span id="viewer-title" class="viewer-title"></span>
      <a class="home-link" href="../index.html"><span class="full-label">INTERFAZ PRINCIPAL</span><span class="compact-label">INICIO</span></a>
      <a id="open-link" class="open-link" target="_blank" rel="noopener">Abrir aparte ↗</a>
    </header>
    <iframe id="deck-frame" title="Presentación seleccionada"></iframe>
  </main>

  <script>
    const catalogView = document.getElementById('catalog-view');
    const viewerView = document.getElementById('viewer-view');
    const presentationList = document.getElementById('presentation-list');
    const catalogError = document.getElementById('catalog-error');
    const viewerTitle = document.getElementById('viewer-title');
    const frame = document.getElementById('deck-frame');
    const openLink = document.getElementById('open-link');
    let presentations = [];

    function openPresentation(presentation) {
      catalogView.hidden = true;
      viewerView.hidden = false;
      viewerTitle.textContent = `${presentation.id} · ${presentation.title}`;
      frame.title = presentation.title;
      frame.src = presentation.file;
      openLink.href = presentation.file;
      history.replaceState(null, '', `#/${encodeURIComponent(presentation.id)}`);
    }

    function showCatalog() {
      viewerView.hidden = true;
      catalogView.hidden = false;
      frame.removeAttribute('src');
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    frame.addEventListener('load', () => {
      const frameDocument = frame.contentDocument;
      if (frameDocument) {
        frameDocument.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && !viewerView.hidden) {
            showCatalog();
          }
        }, true);
      }
    });

    function renderPresentations(items) {
      presentationList.replaceChildren();

      items.forEach((presentation) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'presentation-card';

        const topLine = document.createElement('span');
        topLine.className = 'card-topline';

        const id = document.createElement('span');
        id.className = 'card-id';
        id.textContent = presentation.id;

        topLine.append(id);

        const title = document.createElement('h2');
        title.textContent = presentation.title;

        const footer = document.createElement('span');
        footer.className = 'card-footer';
        const footerLabel = document.createElement('span');
        footerLabel.textContent = 'Ver presentación';
        const arrow = document.createElement('span');
        arrow.setAttribute('aria-hidden', 'true');
        arrow.textContent = '→';
        footer.append(footerLabel, arrow);

        card.append(topLine, title, footer);
        card.addEventListener('click', () => openPresentation(presentation));
        presentationList.append(card);
      });
    }

    async function loadCatalog() {
      try {
        presentations = [];
        for (let slideNumber = 1; ; slideNumber += 1) {
          const file = `slides${slideNumber}.html`;
          const pageResponse = await fetch(`./${file}`, { cache: 'no-store' });
          if (pageResponse.status === 404) {
            break;
          }
          if (!pageResponse.ok) {
            throw new Error(`No se pudo leer ${file} (estado ${pageResponse.status}).`);
          }

          const html = await pageResponse.text();
          const page = new DOMParser().parseFromString(html, 'text/html');
          const title = page.querySelector('title')?.textContent?.trim() || file.replace(/\.html?$/i, '');

          presentations.push({
            id: `slides${slideNumber}`,
            title,
            file
          });
        }

        if (presentations.length === 0) {
          throw new Error('No se encontraron presentaciones con nombres slides1.html, slides2.html, etc. en la carpeta.');
        }

        renderPresentations(presentations);

        const requestedId = decodeURIComponent(window.location.hash.slice(2));
        const requestedPresentation = presentations.find((item) => item.id === requestedId);
        if (requestedPresentation) {
          openPresentation(requestedPresentation);
        }
      } catch (error) {
        console.error('No se pudo cargar el catálogo de presentaciones.', error);
        catalogError.hidden = false;
        catalogError.textContent = `No se pudieron detectar las presentaciones publicadas: ${error.message} Comprueba que el repositorio sea público y vuelve a intentarlo más tarde.`;
      }
    }

    document.getElementById('back-button').addEventListener('click', showCatalog);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !viewerView.hidden) {
        showCatalog();
        return;
      }

      if (!viewerView.hidden && ['ArrowLeft', 'ArrowRight', ' '].includes(event.key)) {
        const frameDocument = frame.contentDocument;
        if (frameDocument) {
          frameDocument.dispatchEvent(new KeyboardEvent('keydown', {
            key: event.key === ' ' ? 'Space' : event.key,
            code: event.code,
            bubbles: true
          }));
          event.preventDefault();
        }
      }
    });

    loadCatalog();
  </script>
</body>

</html>
