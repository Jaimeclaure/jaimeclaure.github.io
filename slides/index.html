<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Deck // Jaime Claure</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
    }

    #deck-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>

<body>

  <!-- NUEVA REGLA: Carga slides.html ubicado dentro de la misma carpeta slides/ -->
  <iframe id="deck-frame" src="slides.html"></iframe>

  <script>
    const frame = document.getElementById('deck-frame');

    window.addEventListener('load', () => {
      if (!window.location.hash) {
        history.replaceState(null, null, '#/0');
      }
    });

    frame.addEventListener('load', () => {
      try {
        const frameWin = frame.contentWindow;

        function syncFromHash() {
          const match = window.location.hash.match(/#\/(\d+)/);
          if (match && frameWin.goToSlide) {
            const slideIndex = parseInt(match[1], 10);
            frameWin.goToSlide(slideIndex);
          }
        }

        window.addEventListener('hashchange', syncFromHash);
        syncFromHash();

        if (frameWin.updateSlide) {
          const originalUpdateSlide = frameWin.updateSlide;
          frameWin.updateSlide = function () {
            originalUpdateSlide.apply(this, arguments);
            if (typeof frameWin.currentSlide !== 'undefined') {
              history.replaceState(null, null, `#/` + frameWin.currentSlide);
            }
          };
        }

        document.addEventListener('keydown', (e) => {
          if (frameWin.document) {
            const event = new KeyboardEvent('keydown', {
              key: e.key,
              code: e.code,
              keyCode: e.keyCode,
              which: e.which,
              bubbles: true
            });
            frameWin.document.dispatchEvent(event);
          }
        });

      } catch (err) {
        console.warn('Ejecutando en entorno estricto; el enrutamiento operará en servidor.', err);
      }
    });
  </script>
</body>

</html>
